<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Account Access</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    p.sub { color: #666; font-size: 13px; margin-top: 0; }
    .tabs { display: flex; gap: 8px; margin: 20px 0; border-bottom: 1px solid #ddd; }
    .tab { padding: 8px 4px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; }
    .tab.active { color: #222; border-bottom-color: #333; font-weight: 600; }
    .panel { display: none; }
    .panel.active { display: block; }
    input { width: 100%; padding: 9px; margin: 6px 0 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 9px 18px; cursor: pointer; border: none; border-radius: 4px; background: #333; color: white; font-size: 14px; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #result { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .success { color: #1a7f37; }
    .error { color: #cf222e; }
  </style>
</head>
<body>
  <h1>Account Access</h1>
  <p class="sub">Practice project — signup and password reset</p>

  <div class="tabs">
    <div class="tab active" data-tab="signup">Sign Up</div>
    <div class="tab" data-tab="forgot">Forgot Password</div>
  </div>

  <div class="panel active" id="panel-signup">
    <input id="su-name" placeholder="Full name" />
    <input id="su-email" placeholder="Email" />
    <input id="su-phone" placeholder="Phone number (optional)" />
    <input id="su-password" type="password" placeholder="Password" />
    <button id="su-btn" onclick="signup()">Create Account</button>
  </div>

  <div class="panel" id="panel-forgot">
    <input id="fp-identifier" placeholder="Email or phone number" />
    <button id="fp-btn" onclick="submitForgotPassword()">Reset Password</button>
  </div>

  <div id="result"></div>

  <script>
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        document.getElementById('result').textContent = '';
      });
    });

    function showResult(message, isError) {
      const el = document.getElementById('result');
      el.textContent = message;
      el.className = isError ? 'error' : 'success';
    }

    async function signup() {
      const name = document.getElementById('su-name').value.trim();
      const email = document.getElementById('su-email').value.trim();
      const phone = document.getElementById('su-phone').value.trim();
      const password = document.getElementById('su-password').value;
      const btn = document.getElementById('su-btn');

      if (!name || !email || !password) {
        return showResult('Please fill in all fields.', true);
      }

      btn.disabled = true;
      btn.textContent = 'Creating...';
      showResult('');

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password }),
        });
        const data = await res.json();
        showResult(data.message, !res.ok);
      } catch (err) {
        showResult('Network error: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }

    async function submitForgotPassword() {
      const identifier = document.getElementById('fp-identifier').value.trim();
      const btn = document.getElementById('fp-btn');

      if (!identifier) {
        return showResult('Please enter your email or phone number.', true);
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      showResult('');

      try {
        const res = await fetch('/api/password/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier }),
        });
        const data = await res.json();
        showResult(data.message, !res.ok);
      } catch (err) {
        showResult('Network error: ' + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    }
  </script>
</body>
</html>
